<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask a Query - H4 Web App</title>
  <link rel="icon" href="{{ url_for('static', filename='images/H4weblogo.png') }}" type="image/png" />
  <link rel="stylesheet" href="{{ url_for('static', filename='contact.css') }}" />
</head>
<body class="form-body">

    
  <nav>
    <div class="left-section">
      <a href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='images/H4weblogo.png') }}" alt="H4 Web Logo" height="35" />
      </a>
      <h2>H4 Web App</h2>
    </div>
    <div class="right-section">
      <a href="{{ url_for('home') }}">Back to Portfolio</a>
    </div>
  </nav>

  <h1>Query & Feedback Form</h1>
  <p>Please fill out this form with your question or feedback</p>

  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash-message {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  
  <form method="POST" action="{{ url_for('contact_page') }}">
    <fieldset>
      <label for="full-name">Enter Your Name: 
        <input id="full-name" name="full-name" type="text" placeholder="e.g. John Doe" required />
      </label>
      <label for="email">Enter Your Email: 
        <input id="email" name="email" type="email" placeholder="e.g. john@example.com" required />
      </label>
    </fieldset>

    <fieldset>
      <label for="referrer">How did you find my portfolio?
        <select id="referrer" name="referrer">
          <option value="">(select one)</option>
          <option value="GitHub">GitHub</option>
          <option value="LinkedIn">LinkedIn</option>
          <option value="Instagram">Instagram</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <label for="bio">Provide your query or feedback:
        <textarea id="bio" name="message" rows="4" cols="30" placeholder="Type your message here..." required></textarea>
      </label>
    </fieldset>

    <input type="submit" value="Submit Query" />
  </form>

</body>
</html>
