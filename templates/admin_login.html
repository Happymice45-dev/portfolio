<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Security Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        
        .login-card {
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 16px;
            border: 2px solid #4f46e5;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: white;
        }

        .login-card input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #4f46e5;
            background: #1e1e2e;
            color: white;
            font-size: 1em;
            box-sizing: border-box;
        }

        .login-card button {
            width: 100%;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-card button:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>🔐 Admin Access Required</h2>
            <p style="color: #a5b4fc; font-size: 0.9em; margin-top: 8px;">Please enter the security password to view form submissions.</p>

            <!-- Password Intake Form -->
            <form action="{{ url_for('admin_dashboard') }}" method="POST">
                <input type="password" name="admin_password" placeholder="Enter Admin Password" required autofocus>
                <button type="submit">Unlock Dashboard</button>
            </form>

            <br>
            <a href="{{ url_for('home') }}" style="color: #818cf8; text-decoration: none; font-size: 0.85em;">← Cancel & Return Home</a>
        </div>
    </div>
</body>
</html>
